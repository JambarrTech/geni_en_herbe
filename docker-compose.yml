# AEERKS — pile de développement et de démonstration
#
# Reproduit en local l'architecture de production : les quatre processus de
# l'backend sont quatre services distincts,communication via PostgreSQL.
#
#   docker compose up --build
#   → écran public   http://localhost:4003
#   → jury           http://localhost:4003/jury
#   → administration http://localhost:4003/admin
#
# Seul le service `static` est exposé sur l'hôte : il sert les fichiers ET
# relaie /api et /ws vers les autres services (c'est le rôle de nginx en
# production). Exposer les quatre ports de l'hôte serait possible, mais
# exposerait l'API et la diffusion publiquement sans nécessité.

name: aeerks

x-image: &image
  # Une seule image, construite une fois, quatre points d'entrée.
  build:
    context: .
    dockerfile: Dockerfile
  image: aeerks/backend:local
  env_file:
    - ./backend/.env
  environment:
    # Surchargés ci-dessous : dans un réseau Docker, le nom du service EST le
    # nom d'hôte. `localhost` y désignerait le conteneur lui-même.
    DATABASE_URL: ${DATABASE_URL:-postgres://aeerks:aeerks@db:5432/aeerks}
    API_PORT: "4000"
    WS_PORT: "4001"
    WORKER_PORT: "4002"
    STATIC_PORT: "4003"
  restart: unless-stopped
  networks: [aeerks]

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeerks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeerks}
      POSTGRES_DB: ${POSTGRES_DB:-aeerks}
    ports:
      # Exposé pour inspection depuis l'hôte (psql, Drizzle Studio). À retirer
      # en production : la base n'a pas besoin d'être publiquement joignable.
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeerks} -d ${POSTGRES_DB:-aeerks}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [aeerks]

  migrate:
    # Image dédiée : `drizzle-kit` est une devDependency, absente de l'image de
    # production. Reconstruire cette cible à chaque déploiement est plus simple
    # que de réinstaller l'outil à chaque exécution de migration.
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: aeerks/migrate:local
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://aeerks:aeerks@db:5432/aeerks}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *image
    command: ["run", "start:api"]
    # L'API ne dépend PAS du service ws : elle publie sur le bus PostgreSQL,
    # pas directement sur le WebSocket. Si le service ws tombe, l'API continue
    # de fonctionner normalement et les clients se resynchronisent à la
    # reconnexion. Le lier ici creerait un faux couplage et ferait dependre le
    # redémarrage de l'API à celui du ws.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ws:
    <<: *image
    command: ["run", "start:ws"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *image
    command: ["run", "start:worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Un seul worker doit tourner : deux boucles de chrono se disputeraient la
    # même ligne de match. Ce `deploy.replicas` explicite le dit ; ne pas le
    # passer à 2 sans avoir installé un verrou de leader.
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  static:
    <<: *image
    command: ["run", "start:static"]
    ports:
      - "${PUBLIC_PORT:-4003}:4003"
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4003/__static_health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  aeerks:
    driver: bridge

volumes:
  db-data:
