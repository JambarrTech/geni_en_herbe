# AEERKS — blueprint Render
#
# UN SEUL SERVICE, ET C'EST DÉLIBÉRÉ
# ===================================
# Render accorde 750 heures gratuites PAR WORKSPACE ET PAR MOIS, partagées entre
# tous les services. Quatre services — un par processus — demanderaient
# 3000 heures, soit quatre fois le plafond. Un service unique consomme
# exactement 750 heures.
#
# Les quatre processus (`api`, `ws`, `worker`, `static`) sont lancés par
# `backend/src/supervisor.ts`, qui les supervise comme quatre processus de l'OS
# distincts. L'ISOLATION EST PRÉSERVÉE : un traitement long côté API ne peut pas
# figer la boucle de chrono. Seul `static` ouvre le port public ; il relaie déjà
# `/api` et `/ws` (cf. `backend/src/server/static.ts`), donc aucun second service
# n'est nécessaire.
#
# UNE SEULE ORIGINE, ET C'EST DÉLIBÉRÉ
# ======================================
# Tout est servi depuis `aeerks.onrender.com` : les trois interfaces par le
# processus `static`, qui relaie `/api` et `/ws` vers `api` et `ws`.
#
# Un CDN devant (Vercel) a été envisagé puis écarté. Le trafic vivant — WebSocket
# et API — part sur Render dans les deux montages : le CDN ne mettrait en cache
# que des fichiers statiques déjà petits, et ajouterait un relais sur chaque appel
# API. Il aurait surtout introduit `WS_ALLOWED_ORIGINS`, une variable dont la
# seule valeur fausse produit un refus en code 1008 — donc un chrono figé, sans
# le moindre message. Le canal temps réel n'est pas le genre de chose qu'on
# laisse dépendre d'une saisie dans un tableau de bord.
#
# Voir `docs/adr/ADR-0006-topologie-deploiement.md` et
# `docs/DEPLOIEMENT-RENDER.md`.
#
# `vercel.json` et `scripts/assemble-vercel-dist.mjs` restent dans le dépôt, sans
# être déployés : le chemin CDN demeure documenté et réversible.
#
# RUNTIME NATIF, PAS D'IMAGE
# ==========================
# Ce service tourne sur le runtime Node de Render : le dépôt ne contient plus de
# Dockerfile. `buildCommand` produit donc TOUT ce que `startCommand` sert — les
# trois applications Vite comme les dépendances du backend.
#
# Le pas-à-pas est dans `docs/DEPLOIEMENT-RENDER.md`.

services:
  - type: web
    name: aeerks
    runtime: node
    plan: free

    # Deux arbres de dépendances, et c'est nécessaire : les workspaces
    # (`apps/*`, à la racine) pour compiler les interfaces, le backend pour
    # l'exécuter. Ils ont chacun leur verrou, donc chacun son `npm ci`.
    #
    # `--include=dev` n'est pas une coquetterie : Render définit
    # `NODE_ENV=production`, ce qui ferait omettre les dépendances de
    # développement — dont `vite`, sans lequel aucune interface ne se compile.
    buildCommand: npm ci --include=dev && npm run build && npm ci --prefix backend

    # Le superviseur DOIT partir de `backend/` : il résout `tsx` à partir du
    # dossier courant (`process.cwd()`) pour ses processus enfants. Lancé depuis
    # la racine, le chargement de `tsx` échouerait.
    #
    # `tsx` est en `dependencies` du backend, pas en `devDependencies` : c'est
    # lui qui exécute ce superviseur, et un `--omit=dev` à l'étape suivante
    # laisserait le service incapable de démarrer.
    startCommand: cd backend && npm run start:all

    # Sonde de Render. `/__static_health` est exposée par le processus `static`
    # et répond avant toute politique de sécurité : une sonde qui dépend de la
    # CSP s'effondre au premier durcissement.
    #
    # Elle ne teste que le processus `static`, pas l'API. C'est délibéré : le
    # relais `/api` est en aval, et une sonde publique qui exigerait la base
    # ferait échouer le déploiement pour une panne dont Render n'est pas
    # responsable. La base est vérifiée par l'API elle-même au démarrage
    # (`checkDatabaseOnce`), qui journalise une erreur explicite.
    healthCheckPath: /__static_health

    # `PORT` est injecté par Render et vaut généralement 10000. Le superviseur
    # le transmet à `static` comme `STATIC_PORT`, et le SUPPRIME pour `api`,
    # `ws` et `worker` — sans quoi l'API tenterait d'écouter sur le port public,
    # déjà pris, et le service mourrait sur EADDRINUSE.
    #
    # Les trois processus privés restent sur 4000/4001/4002 : injoignables de
    # l'extérieur.

    # Migrations : à la main, une fois, depuis votre machine (`npm run
    # db:migrate`). Rien à automatiser ici : `drizzle-kit` est une devDependency
    # et ne fait pas partie du service. Voir docs/DEPLOIEMENT-RENDER.md.

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # `TRUST_PROXY=true` fait lire X-Forwarded-For par req.ip. Sans cela, le
      # rate-limit de connexion se bucketise sur l'IP du proxy : un seul
      # compteur pour tout le trafic, donc la protection devient inopérante
      # dès le premier bot.
      - key: TRUST_PROXY
        value: "true"
      # Vide = MÊME ORIGINE UNIQUEMENT, ce qui est exactement le déploiement
      # retenu : l'interface est servie par ce service, donc le navigateur
      # annonce l'origine de Render, et elle est automatiquement autorisée.
      #
      # Cette valeur est donc écrite ici, et non laissée à définir dans le
      # dashboard. C'est tout l'intérêt de la mono-origine : il n'y a AUCUNE
      # variable à saisir, donc aucune occasion de se tromper.
      #
      # Ce qu'on évite, précisément : une liste d'origines à maintenir pour un
      # déploiement à deux origines. Le serveur de diffusion refuse toute
      # connexion dont l'origine n'est pas dans la liste, et ce refus est en
      # code 1008 — le jury se connecte, mais le chrono ne descend pas, sans la
      # moindre erreur visible ailleurs.
      #
      # Si un jour l'interface part sur un CDN (docs/DEPLOIEMENT-VERCEL.md), il
      # faudra remplacer `""` par l'origine du CDN, sans barre oblique finale :
      #
      #     WS_ALLOWED_ORIGINS=https://aeerks.vercel.app
      #
      # Renseigner la variable NE SUFFIT PAS : il faut aussi que `connect-src`
      # de la CSP l'autorise, sinon c'est le navigateur qui bloque. Les deux
      # se vérifient dans `npm run render:check`.
      - key: WS_ALLOWED_ORIGINS
        value: ""

      # AUCUNE variable NODE_OPTIONS, volontairement.
      #
      # J'avais d'abord écrit `--max-old-space-size=480` en pensant « 512 Mo
      # moins une marge ». C'est faux dès que le superviseur tourne : la
      # variable est héritée par les QUATRE processus enfants, donc 4 × 480 Mo
      # potentiels pour 512 Mo réels. Le plafond devient une promesse que le
      # service ne peut pas tenir, et Node raisonne alors en OOM imminent bien
      # avant qu'il n'arrive — GC agressif, puis mort.
      #
      # Le plafond du V8 par défaut s'ajuste déjà à la mémoire disponible. Une
      # valeur écrite à la main ne peut que mentir sur ce point.
      #
      # Si la mémoire devient un problème, le bon levier est `plan:
      # 0.5c-512mb` (0,5 CPU au lieu de 0,1) ou un plan payant — pas un plafond
      # V8.
