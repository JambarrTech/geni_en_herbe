# AEERKS — blueprint Render
#
# UN SEUL SERVICE, ET C'EST DÉLIBÉRÉ
# ===================================
# Render accorde 750 heures gratuites PAR WORKSPACE ET PAR MOIS, partagées entre
# tous les services. Quatre services — un par processus — demanderaient
# 3000 heures, soit quatre fois le plafond. Un service unique consomme
# exactement 750 heures.
#
# Les quatre processus (`api`, `ws`, `worker`, `static`) sont lancés par
# `backend/src/supervisor.ts`, qui les supervise comme quatre processus de l'OS
# distincts. L'ISOLATION EST PRÉSERVÉE : un traitement long côté API ne peut pas
# figer la boucle de chrono. Seul `static` ouvre le port public ; il relaie déjà
# `/api` et `/ws` (cf. `backend/src/server/static.ts`), donc aucun second service
# n'est nécessaire.
#
# RUNTIME NATIF, ROOT DIRECTORY = backend/
# =========================================
# Ce service tourne sur le runtime Node de Render et ne voit QUE le dossier
# `backend/` (champ `rootDir`). Deux conséquences :
#   - `buildCommand` n'installe que les dépendances du backend. Les trois
#     applications Vite ne sont PLUS compilées ici : elles sont servies par le
#     CDN Vercel (cf. docs/DEPLOIEMENT-VERCEL.md). Les compiler sur Render
#     prenait une minute et ~200 Mo pour produire des fichiers que ce service
#     ne sert pas ;
#   - `tsx` est une dépendance de PRODUCTION du backend (cf.
#     `backend/package.json`), puisqu'il est le chargeur qui exécute le
#     superviseur. Une installation `--omit=dev` ne le retirerait donc pas.
#
# `render.yaml` reste à la racine : Render ne lit un Blueprint que depuis la
# racine du dépôt. C'est `rootDir` qui restreint le service au backend.
#
# Le pas-à-pas est dans `docs/DEPLOIEMENT-RENDER.md`.

services:
  - type: web
    name: aeerks
    runtime: node
    plan: free

    # Le service ne connaît que `backend/`. Le dépôt est toujours cloné en
    # entier — `rootDir` change le dossier courant des commandes de build et de
    # démarrage, pas ce qui est disponible sur le disque.
    rootDir: backend

    # Un seul arbre de dépendances, celui du backend : plus de double
    # installation (workspaces racine + backend).
    #
    # `tsx` est en `dependencies` et non en `devDependencies` : c'est lui qui
    # exécute le superviseur au démarrage, donc un `--omit=dev` ne doit pas
    # pouvoir l'emporter. `drizzle-kit` reste en devDependency, ce qui est sans
    # effet ici : les migrations s'appliquent à la main, depuis la machine.
    buildCommand: npm ci

    # Relativement à `rootDir`, le superviseur part déjà de `backend/` : il
    # résout `tsx` à partir de `process.cwd()` pour ses processus enfants.
    startCommand: npm run start:all

    # Sonde de Render. `/__static_health` est exposée par le processus `static`
    # et répond avant toute politique de sécurité : une sonde qui dépend de la
    # CSP s'effondre au premier durcissement.
    #
    # Elle ne teste que le processus `static`, pas l'API. C'est délibéré : le
    # relais `/api` est en aval, et une sonde publique qui exigerait la base
    # ferait échouer le déploiement pour une panne dont Render n'est pas
    # responsable. La base est vérifiée par l'API elle-même au démarrage
    # (`checkDatabaseOnce`), qui journalise une erreur explicite.
    healthCheckPath: /__static_health

    # `PORT` est injecté par Render et vaut généralement 10000. Le superviseur
    # le transmet à `static` comme `STATIC_PORT`, et le SUPPRIME pour `api`,
    # `ws` et `worker` — sans quoi l'API tenterait d'écouter sur le port public,
    # déjà pris, et le service mourrait sur EADDRINUSE.
    #
    # Les trois processus privés restent sur 4000/4001/4002 : injoignables de
    # l'extérieur.

    # Migrations : à la main, une fois, depuis votre machine (`npm run
    # db:migrate`). Rien à automatiser ici : `drizzle-kit` est une devDependency
    # et ne fait pas partie du service. Voir docs/DEPLOIEMENT-RENDER.md.

    envVars:
      - key: DATABASE_URL
        sync: false
      # Le processus `static` ne sert ici QUE /api, /ws et la sonde : les
      # écrans sont sur le CDN Vercel. Le mode est aussi DÉDUIT de l'absence
      # de `apps/*/dist`, mais le dire explicitement ferme le cas où un `dist/`
      # traîne (build manuel, cache) : les deux versions se disputeraient le
      # même chemin, et celle qui répondrait dépendrait d'un artefact.
      - key: STATIC_SERVE_APPS
        value: "false"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # `TRUST_PROXY=true` fait lire X-Forwarded-For par req.ip. Sans cela, le
      # rate-limit de connexion se bucketise sur l'IP du proxy : un seul
      # compteur pour tout le trafic, donc la protection devient inopérante
      # dès le premier bot.
      - key: TRUST_PROXY
        value: "true"
      # À DÉFINIR DANS LE DASHBOARD RENDER. C'est la seule variable que ce
      # blueprint ne peut pas préremplir, parce qu'elle dépend du domaine choisi
      # pour l'interface.
      #
      # Le serveur de diffusion REFUSE toute connexion dont l'origine n'est pas
      # dans la liste. Vide = même origine uniquement, ce qui suffit quand
      # l'interface est servie par ce service lui-même.
      #
      # Si l'interface est sur Vercel (docs/DEPLOIEMENT-VERCEL.md), le navigateur
      # annonce l'origine Vercel, pas celle de Render : la valeur doit donc être
      # l'origine Vercel, sans barre oblique finale.
      #
      #     WS_ALLOWED_ORIGINS=https://aeerks.vercel.app
      #
      # Symptôme d'une valeur absente ou incorrecte : la connexion est refusée en
      # code 1008, le jury se connecte mais le chrono ne descend pas. Aucune erreur
      # visible ailleurs — d'où l'importance de cette variable. `sync: false` est
      # donc volontaire : elle rend le setting explicite plutôt que silencieusement
      # vide.
      - key: WS_ALLOWED_ORIGINS
        sync: false

      # AUCUNE variable NODE_OPTIONS, volontairement.
      #
      # J'avais d'abord écrit `--max-old-space-size=480` en pensant « 512 Mo
      # moins une marge ». C'est faux dès que le superviseur tourne : la
      # variable est héritée par les QUATRE processus enfants, donc 4 × 480 Mo
      # potentiels pour 512 Mo réels. Le plafond devient une promesse que le
      # service ne peut pas tenir, et Node raisonne alors en OOM imminent bien
      # avant qu'il n'arrive — GC agressif, puis mort.
      #
      # Le plafond du V8 par défaut s'ajuste déjà à la mémoire disponible. Une
      # valeur écrite à la main ne peut que mentir sur ce point.
      #
      # Si la mémoire devient un problème, le bon levier est `plan:
      # 0.5c-512mb` (0,5 CPU au lieu de 0,1) ou un plan payant — pas un plafond
      # V8.
