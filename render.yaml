# AEERKS — blueprint Render
#
# UN SEUL SERVICE, ET C'EST DÉLIBÉRÉ
# ===================================
# Render accorde 750 heures gratuites PAR WORKSPACE ET PAR MOIS, partagées entre
# tous les services. Quatre services — un par processus, comme dans
# `docker-compose.yml` — demanderaient 3000 heures : quatre fois le plafond.
# Un service unique consomme exactement 750 heures.
#
# Les quatre processus (`api`, `ws`, `worker`, `static`) sont donc lancés par
# `backend/src/supervisor.ts`, qui les supervise comme quatre processus de
# l'OS distincts. L'ISOLATION EST PRÉSERVÉE : un traitement long côté API ne
# peut pas figer la boucle de chrono. Seul `static` ouvre le port public ; il
# relaie déjà `/api` et `/ws` (cf. `backend/src/server/static.ts`), donc aucun
# second service n'est nécessaire.
#
# Le pas-à-pas est dans `docs/DEPLOIEMENT-RENDER.md`.

services:
  - type: web
    name: aeerks
    runtime: docker
    plan: free

    # Le Dockerfile construit déjà les trois applications Vite et installe les
    # dépendances de production du backend : il n'y a rien à faire avant.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `dockerCommand`, et NON `buildCommand`.
    #
    # Render réserve `buildCommand` aux runtimes natifs (node, python…) : sur un
    # service `runtime: docker`, c'est le Dockerfile qui construit, et le champ
    # qui remplace son `CMD` est `dockerCommand`. Un `buildCommand` ici serait
    # purement ignoré — et laisserait croire qu'une étape de construction
    # existe, alors que c'est le Dockerfile qui s'en charge.
    #
    # Le `CMD` du Dockerfile est déjà `start:all`, donc ce champ est
    # techniquement facultatif. On l'écrit quand même, pour deux raisons : le superviseur est
    # l'entrée du déploiement, elle mérite d'être visible dans la configuration
    # Render et pas seulement dans le Dockerfile ; et un jour où le `CMD` serait
    # modifié, Render ne démarrerait pas le mauvais processus.
    #
    # Valeur : ce que Render passe en arguments de l'ENTRYPOINT, qui est
    # `tini -- npm run`. Donc `npm run start:all`.
    dockerCommand: start:all

    # Sonde de Render. `/__static_health` est exposée par le processus `static`
    # et répond avant toute politique de sécurité : une sonde qui dépend de la
    # CSP s'effondre au premier durcissement.
    #
    # Elle ne teste que le processus `static`, pas l'API. C'est délibéré : le
    # relais `/api` est en aval, et une sonde publique qui exigerait la base
    # ferait échouer le déploiement pour une panne dont Render n'est pas
    # responsable. La base est vérifiée par l'API elle-même au démarrage
    # (`checkDatabaseOnce`), qui journalise une erreur explicite.
    healthCheckPath: /__static_health

    # `PORT` est injecté par Render et vaut généralement 10000. Le superviseur
    # le transmet à `static` comme `STATIC_PORT`, et le SUPPRIME pour `api`,
    # `ws` et `worker` — sans quoi l'API tenterait d'écouter sur le port public,
    # déjà pris, et le conteneur mourrait sur EADDRINUSE.
    #
    # Les trois processus privés restent sur 4000/4001/4002 : injoignables de
    # l'extérieur, ce qui est la disposition de `docker-compose.yml`.

    # Migrations AVANT le démarrage du service.
    #
    # Fourni mais DÉSACTIVÉ : les migrations s'appliquent à la main, une fois,
    # depuis votre machine (`npm run db:migrate`). Voir docs/DEPLOIEMENT-RENDER.md.
    #
    # Pour l'automatiser, deux options : Render n'a pas de type `job`.
    # Une migration est une TÂCHE PONCTUELLE qui se termine — donc `type: cron`
    # avec un planning, pas `type: worker` (qui reste résident). Le blueprint ci-dessous
    # est laissé commenté parce que `drizzle-kit` est une devDependency absente de
    # l'image de production : il viserait la cible `migrate` du Dockerfile, qui
    # installe les dépendances de développement.
    #
    # Si vous le décommentez, déclarez-le AVANT `aeerks` : Render traite les
    # services dans l'ordre, donc le schéma sera prêt quand l'API recevra sa
    # première requête.
    #
    #   - type: cron
    #     name: aeerks-migrations
    #     runtime: docker
    #     schedule: "0 3 1 * *"     # le 1er de chaque mois à 03:00 UTC
    #     dockerfilePath: ./Dockerfile.migrate
    #     dockerContext: .
    #     dockerCommand: db:migrate
    #     envVars:
    #       - key: DATABASE_URL
    #         sync: false

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # `TRUST_PROXY=true` fait lire X-Forwarded-For par req.ip. Sans cela, le
      # rate-limit de connexion se bucketise sur l'IP du proxy : un seul
      # compteur pour tout le trafic, donc la protection devient inopérante
      # dès le premier bot.
      - key: TRUST_PROXY
        value: "true"
      # VIDE, et c'est volontaire. Tout est sur une seule origine, donc le
      # contrôle d'origine des WebSocket laisse passer l'interface. Le
      # renseigner ici restreindrait l'accès au LAN sans nécessité — voir
      # `backend/.env.example`.
      - key: WS_ALLOWED_ORIGINS
        value: ""

      # AUCUNE variable NODE_OPTIONS, volontairement.
      #
      # J'avais d'abord écrit `--max-old-space-size=480` en pensant « 512 Mo
      # moins une marge ». C'est faux dès que le superviseur tourne : la
      # variable est héritée par les QUATRE processus enfants, donc 4 × 480 Mo
      # potentiels pour 512 Mo réels. Le plafond devient une promesse que le
      # conteneur ne peut pas tenir, et Node raisonne alors en OOM imminent
      # bien avant qu'il n'arrive — GC agressif, puis mort.
      #
      # Le plafond du V8 par défaut s'ajuste déjà à la mémoire du conteneur, et
      # il le fait en tenant compte de ce qui est réellement disponible. Une
      # valeur écrite à la main ne peut que mentir sur ce point.
      #
      # Si la mémoire devient un problème, le bon levier est `plan:
      # 0.5c-512mb` (0,5 CPU au lieu de 0,1) ou un plan payant — pas un plafond
      # V8.